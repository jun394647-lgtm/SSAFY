name: Deploy to Streamlit Cloud

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Push to Streamlit Cloud
      run: |
        git remote add streamlit https://share.streamlit.io/
        git push -u streamlit main
